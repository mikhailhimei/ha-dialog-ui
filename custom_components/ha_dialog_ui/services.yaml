reminder_create:
  name: Создать напоминание
  description: Озвучить текст целиком на выбранной колонке в указанную дату или через интервал.
  fields:
    text:
      name: Что напомнить
      required: true
      example: Напомнить насыпать еды через 30 минут
      selector:
        text:
          multiline: true
    device_id:
      name: Где напомнить
      description: ID устройства HA либо entity_id assist_satellite или media_player.
      required: true
      selector:
        text:
    at:
      name: Когда напомнить
      description: Дата и время ISO 8601. Без часового пояса используется часовой пояс HA. Используется, только если delay_minutes не заполнен.
      example: '2026-11-02T18:30:00+05:00'
      selector:
        text:
    delay_minutes:
      name: Через сколько минут
      description: Интервал в минутах от текущего момента. Можно указать число или шаблон Home Assistant, например {{ reminder_minutes }}. Если заполнен, поле at игнорируется.
      example: "{{ reminder_minutes }}"
      selector:
        text:
reminder_info:
  name: Информация о напоминаниях
  description: Возвращает ожидающие и озвучиваемые напоминания выбранной колонки. Поиск по тексту необязателен. Для завершённых и ошибочных записей включите include_history.
  fields:
    query:
      name: Поиск по тексту
      description: Часть текста напоминания без учёта регистра. Пустое поле возвращает все подходящие записи выбранной колонки.
      required: false
      example: насыпать еды
      selector:
        text:
    include_history:
      name: Включить историю
      default: false
      selector:
        boolean: {}
    id:
      name: UUID напоминания
      selector:
        text:
    device_id:
      name: ID колонки
      description: Тот же ID колонки, который передан при создании напоминания.
      required: true
      selector:
        text:
reminder_delete:
  name: Удалить напоминание
  description: Отменяет ожидающее напоминание или удаляет запись из истории по UUID.
  fields:
    id:
      name: UUID напоминания
      required: true
      selector:
        text:
send_command:
  name: Ответить в диалог
  description: >-
    Передаёт результат скрипта в ожидающий диалог. Тип результата выбирает
    настроенный текст ответа, а variables подставляет в него значения.
    Озвучку выполняет TTS текущего Assist-пайплайна.
  fields:
    deviceId:
      name: ID устройства
      description: >-
        Устройство исходного запроса. Передайте {{ dialog_payload.device_id }}
        без изменений. Не заменяйте его на media_player или ID другой колонки:
        ответ сопоставляется одновременно по ID клиента и ID устройства.
      required: true
      example: "{{ dialog_payload.device_id }}"
      selector:
        text:
    actionType:
      name: Тип результата скрипта
      description: >-
        Тип ответа, настроенный в команде, например success или room_required.
        Для настройки «Если ничего не нашёл» с полем «Текст озвучки» укажите success.
        Это тип результата, а не UUID команды и не текст для произнесения.
      required: true
      example: success
      selector:
        text:
    variables:
      name: Переменные ответа
      description: >-
        Объект с данными для подстановки в текст ответа. Например,
        {"temperature": 22, "reply": "Свет включён"}. В тексте используйте
        ${temperature} или ${reply}: имя должно совпадать с ключом объекта.
        В YAML можно передать словарь, в текстовом поле — JSON-объект.
      required: false
      example: '{"reply": "Свет включён", "temperature": 22}'
      selector:
        text:
          multiline: true
    useDeclension:
      name: Подготовить текст к озвучке
      description: >-
        Преобразует числа, даты и время в форму для произнесения.
        Включено по умолчанию. Выключите, если подготовили текст самостоятельно
        и хотите передать его в Assist без этой обработки.
      required: false
      default: true
      example: true
      selector:
        boolean: {}

alarm_create:
  name: Alarm create
  description: Create a Dialog Custom UI alarm from Home Assistant YAML scripts.
  fields:
    hh:
      name: HH
      description: Час будильника. Значения 1–12 выбирают ближайшее будущее утро или вечер; 0 и 13–23 задают точное время. Можно передать число или шаблон Home Assistant.
      required: false
      example: "{{ alarm_hh }}"
      selector:
        text:
    mm:
      name: MM
      description: Alarm minute. Accepts a number or a Home Assistant template/variable.
      required: false
      example: "{{ alarm_mm }}"
      selector:
        text:
    deviceId:
      name: Device ID
      description: Home Assistant device ID or media_player entity ID. device_id is also accepted.
      required: false
      selector:
        text:
    repeat_type:
      name: Repeat
      description: Alarm repeat mode.
      required: false
      default: once
      selector:
        select:
          options:
            - value: once
              label: Один раз
            - value: daily
              label: Повторять каждый день
            - value: weekdays
              label: По будням
            - value: weekends
              label: По выходным
            - value: custom
              label: Кастом
    repeat_days:
      name: Custom days
      description: Custom repeat days used only when Repeat is custom.
      required: false
      selector:
        select:
          multiple: true
          mode: dropdown
          options:
            - value: monday
              label: Понедельник
            - value: tuesday
              label: Вторник
            - value: wednesday
              label: Среда
            - value: thursday
              label: Четверг
            - value: friday
              label: Пятница
            - value: saturday
              label: Суббота
            - value: sunday
              label: Воскресенье
alarm_info:
  name: Alarm info
  description: List Dialog Custom UI alarms. Returns JSON items with time, uuid, clientId, and deviceId.
  fields:
    deviceId:
      name: Device ID
      description: Optional speaker identifier. Uses the client configured in integration settings to return records on the selected speaker. Also accepts device_id in YAML.
      required: false
      selector:
        text:

alarm_delete:
  name: Alarm delete
  description: Delete a Dialog Custom UI alarm by UUID.
  fields:
    uuid:
      name: UUID
      description: Alarm UUID from the info list to delete.
      required: true
      selector:
        text:

timer_create:
  name: Timer create
  description: Create a Dialog Custom UI timer from Home Assistant YAML scripts.
  fields:
    hh:
      name: HH
      description: Timer hours. Accepts a number or a Home Assistant template/variable.
      required: false
      example: "{{ timer_hh }}"
      selector:
        text:
    mm:
      name: MM
      description: Timer minutes. Accepts a number or a Home Assistant template/variable.
      required: false
      example: "{{ timer_mm }}"
      selector:
        text:
    ss:
      name: SS
      description: Timer seconds. Accepts a number or a Home Assistant template/variable.
      required: false
      example: "{{ timer_ss }}"
      selector:
        text:
    deviceId:
      name: Device ID
      description: Home Assistant device ID or media_player entity ID. device_id is also accepted.
      required: false
      selector:
        text:

timer_info:
  name: Timer info
  description: List Dialog Custom UI timers. Returns JSON items with uuid, clientId, deviceId, current remaining timer duration (time/remaining_timer/remaining_seconds), and original timer duration (count_timer/total_seconds).
  fields:
    deviceId:
      name: Device ID
      description: Optional speaker identifier. Uses the client configured in integration settings to return records on the selected speaker. Also accepts device_id in YAML.
      required: false
      selector:
        text:

timer_delete:
  name: Timer delete
  description: Delete a Dialog Custom UI timer by UUID.
  fields:
    uuid:
      name: UUID
      description: Timer UUID from the info list to delete.
      required: true
      selector:
        text:

monitor_start_source:
  name: Запустить источник звука
  description: Включить микрофон выбранной колонки и дождаться подключения к HA.
  fields:
    device_id:
      name: Колонка-источник
      required: true
      selector:
        device:
          integration: esphome
monitor_start_listener:
  name: Запустить слушатель
  description: Воспроизводить звук источника на другой колонке. Источник нужно запустить заранее.
  fields:
    source_device_id:
      name: Колонка-источник
      required: true
      selector:
        device:
          integration: esphome
    device_id:
      name: Колонка-слушатель
      required: true
      selector:
        device:
          integration: esphome
    ha_url:
      name: Локальный URL Home Assistant
      description: Необязательно. Например http://192.168.31.83:8123; должен быть доступен колонке. По умолчанию внутренний URL HA.
      required: false
      selector:
        text:
monitor_stop:
  name: Остановить радионяню
  description: Остановить обе колонки пары и вернуть обычный режим. Без пары остановить выбранную колонку.
  fields:
    device_id:
      name: Любая колонка пары
      required: true
      selector:
        device:
          integration: esphome

call_start:
  name: Позвонить на колонку
  description: Начать вызов между двумя колонками. Разговор начинается после ответа.
  fields:
    source_device_id:
      name: Колонка, с которой звонить
      required: true
      selector:
        device:
          integration: esphome
    target_device_id:
      name: Колонка, на которую звонить
      required: true
      selector:
        device:
          integration: esphome

call_answer:
  name: Ответить на звонок
  description: Принять входящий вызов на выбранной колонке.
  fields:
    device_id:
      name: Колонка
      required: true
      selector:
        device:
          integration: esphome

call_end:
  name: Положить трубку
  description: Завершить вызов на обеих колонках по ID любой из них.
  fields:
    device_id:
      name: Колонка
      required: true
      selector:
        device:
          integration: esphome

call_phone:
  name: Позвонить пользователю на телефон
  description: Вызов от колонки появится у выбранного пользователя в разделе «Звонки». Микрофон включится только после ответа; закрытое приложение не получает push-вызов.
  fields:
    source_device_id:
      name: Колонка
      required: true
      selector:
        device:
          integration: esphome
    user_id:
      name: Пользователь Home Assistant
      required: true
      selector:
        select:
          options: []
          mode: dropdown
          custom_value: false
    timeout:
      name: Время ожидания ответа
      default: 120
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: s

activity_stop:
  name: Остановить сигнал таймера или будильника
  description: Остановить звучащий будильник или таймер на совместимой колонке. Звонки и сохранённое расписание не затрагиваются.
  fields:
    device_id:
      name: Колонка
      required: true
      selector:
        device:
          integration: esphome
